{% load static %}

<!doctype html>

<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}DataCampus{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="{% static 'css/estilos.css' %}" rel="stylesheet">

</head>

<body class="{% block classe_corpo %}{% endblock %}">

{% block corpo %}{% endblock %}

<footer class="rodape-datacampus">
    <div class="rodape-conteudo">
        <nav class="rodape-links" aria-label="Links legais">
            <a href="{% url 'termos_de_uso' %}">Termos de uso</a>
            <a href="{% url 'politica_privacidade' %}">Política de privacidade</a>
        </nav>
        <p class="rodape-direitos">© {% now "Y" %} DataCampus · Projeto acadêmico. Todos os direitos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}{% endblock %}

</body>

</html>
